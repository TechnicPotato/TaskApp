name: Lint, test and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    working-directory: "task-app"
jobs:
  checks:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: task-app/.nvmrc
          cache: npm
          cache-dependency-path: task-app/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up gcloud with Firestore emulator
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator

      - name: Start Firestore emulator
        run: gcloud emulators firestore start --host-port=127.0.0.1:8080 > emulator.log 2>&1 &

      - name: Wait for Firestore emulator
        run: |
          for attempt in $(seq 1 30); do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "Emulator is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Emulator did not start in time"
          cat emulator.log
          exit 1

      - name: Run unit tests
        run: npm run test:run
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker build
        run: |
          docker build -t task-app:ci .

      - name: Run Docker container
        run: docker run --detach --name task-app -e TASK_STORE=memory -p 3000:8080 task-app:ci

      - name: Wait for app and check static asset
        run: |
          app_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "App is ready"
              app_ready=true
              break
            fi
            sleep 1
          done

          if [ "$app_ready" != true ]; then
            echo "App did not start in time"
            docker logs task-app
            exit 1
          fi

          if ! curl --fail --silent --show-error http://127.0.0.1:3000/file.svg --output /dev/null; then
            echo "Static asset /file.svg failed to load"
            docker logs task-app
            exit 1
          fi
          echo "Static asset /file.svg loaded"

          if ! curl --fail --silent http://127.0.0.1:3000/ > page.html; then
            echo "Could not retrieve homepage HTML for the CSS bundle check"
            docker logs task-app
            exit 1
          fi
          css_path=$(grep -o '/_next/static/[^\"]*\.css' page.html | head -n 1)
          if [ -z "$css_path" ]; then
            echo "No Next.js CSS bundle path found in the homepage HTML"
            docker logs task-app
            exit 1
          fi

          if ! curl --fail --silent --show-error "http://127.0.0.1:3000${css_path}" --output /dev/null; then
            echo "Next.js CSS bundle failed to load: ${css_path}"
            docker logs task-app
            exit 1
          fi
          echo "Next.js CSS bundle loaded: ${css_path}"

  deploy:
    name: Deploy
    needs: [docker, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: task-app-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      RUNTIME_SA: task-app-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/task-app/task-app:${{ github.sha }}
      SERVICE: task-app

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Authenticate
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Docker build
        run: |
          docker build -t "$IMAGE" .

      - name: Docker push
        run: |
          docker push "$IMAGE"

      - name: gcloud run deploy
        run: |
          gcloud run deploy "$SERVICE" \
          --image "$IMAGE" \
          --region "$REGION" \
          --service-account "$RUNTIME_SA" \
          --project "$PROJECT" \
          --set-env-vars TASK_STORE=firestore \
          --max-instances 2 \
          --min-instances 0 \
          --no-allow-unauthenticated \
          --quiet
